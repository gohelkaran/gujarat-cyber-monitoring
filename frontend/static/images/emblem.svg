  <!-- Shield Outline -->
  <path d="M50 8 L85 22 V52 C85 72 50 92 50 92 C50 92 15 72 15 52 V22 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
